services:
  - type: web
    name: campusnet-monitor
    runtime: python
    plan: free
    region: oregon
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r requirements.txt"
    startCommand: "gunicorn backend.app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
